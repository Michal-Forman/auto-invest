name: Keep-alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, keeps repo active so the daily schedule in actions.yaml never hits GitHub's 60-day auto-disable

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git diff --cached --quiet || git commit -m "chore: keepalive ping"
          git push
